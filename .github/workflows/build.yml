
name: Build TiKTWO APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TiKTWO Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Firebase configuration
        shell: bash
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json is missing."
            exit 1
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --project-name tiktwo --org com.tiktwo .

      - name: Configure Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1
              )

          s = re.sub(r'android:label="[^"]*"', 'android:label="TiKTWO"', s)
          p.write_text(s)

          for filename in (
              "android/app/build.gradle.kts",
              "android/app/build.gradle",
          ):
              p = Path(filename)
              if p.exists():
                  s = p.read_text()
                  s = re.sub(
                      r'minSdk\s*=\s*flutter\.minSdkVersion',
                      'minSdk = 23',
                      s
                  )
                  s = re.sub(
                      r'minSdkVersion\s+flutter\.minSdkVersion',
                      'minSdkVersion 23',
                      s
                  )
                  p.write_text(s)
          PY

      - name: Install app dependencies
        run: |
          flutter pub add firebase_core firebase_auth cloud_firestore video_player image_picker share_plus

      - name: Generate Firebase options
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("google-services.json").read_text())
          info = data["project_info"]

          client = next(
              (
                  item for item in data["client"]
                  if item["client_info"]["android_client_info"]["package_name"]
                  == "com.tiktwo.tiktwo"
              ),
              None
          )

          if client is None:
              raise SystemExit(
                  "ERROR: Firebase package must be com.tiktwo.tiktwo"
              )

          api_key = client["api_key"][0]["current_key"]
          app_id = client["client_info"]["mobilesdk_app_id"]
          project_id = info["project_id"]
          sender_id = str(info["project_number"])
          bucket = info.get("storage_bucket")

          lines = [
              "import 'package:firebase_core/firebase_core.dart';",
              "",
              "class DefaultFirebaseOptions {",
              "  static const FirebaseOptions android = FirebaseOptions(",
              f"    apiKey: {json.dumps(api_key)},",
              f"    appId: {json.dumps(app_id)},",
              f"    messagingSenderId: {json.dumps(sender_id)},",
              f"    projectId: {json.dumps(project_id)},",
          ]

          if bucket:
              lines.append(f"    storageBucket: {json.dumps(bucket)},")

          lines.extend(["  );", "}"])
          Path("lib/firebase_options.dart").write_text(
              "\n".join(lines) + "\n"
          )
          PY

      - name: Write complete TiKTWO app
        shell: bash
        run: |
          cat > lib/main.dart <<'DART'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:video_player/video_player.dart';
          import 'firebase_options.dart';

          const bg = Color(0xFF09070D);
          const panel = Color(0xFF17121F);
          const pink = Color(0xFFFF2D8D);
          const purple = Color(0xFF9B5CFF);

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(
              options: DefaultFirebaseOptions.android,
            );
            runApp(const TikTwoApp());
          }

          class TikTwoApp extends StatelessWidget {
            const TikTwoApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'TiKTWO',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: bg,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: pink,
                    brightness: Brightness.dark,
                  ),
                  inputDecorationTheme: InputDecorationTheme(
                    filled: true,
                    fillColor: panel,
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(16),
                      borderSide: BorderSide.none,
                    ),
                  ),
                ),
                home: const AuthGate(),
              );
            }
          }

          class AuthGate extends StatelessWidget {
            const AuthGate({super.key});

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<User?>(
                stream: FirebaseAuth.instance.authStateChanges(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState == ConnectionState.waiting) {
                    return const Scaffold(
                      body: Center(
                        child: CircularProgressIndicator(color: pink),
                      ),
                    );
                  }
                  if (snapshot.hasError) {
                    return const Scaffold(
                      body: Center(
                        child: Text('تعذر الاتصال بخدمة الحسابات'),
                      ),
                    );
                  }
                  return snapshot.data == null
                      ? const LoginScreen()
                      : const MainScreen();
                },
              );
            }
          }

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});

            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final email = TextEditingController();
            final password = TextEditingController();
            final name = TextEditingController();
            bool registering = false;
            bool busy = false;

            void message(String text) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(text)),
              );
            }

            Future<void> submit() async {
              if (email.text.trim().isEmpty ||
                  password.text.length < 6) {
                message('أدخل البريد وكلمة مرور من 6 أحرف على الأقل');
                return;
              }

              setState(() => busy = true);

              try {
                final auth = FirebaseAuth.instance;

                if (registering) {
                  final result = await auth.createUserWithEmailAndPassword(
                    email: email.text.trim(),
                    password: password.text,
                  );

                  final displayName = name.text.trim().isEmpty
                      ? email.text.trim().split('@').first
                      : name.text.trim();

                  await result.user?.updateDisplayName(displayName);

                  await FirebaseFirestore.instance
                      .collection('users')
                      .doc(result.user!.uid)
                      .set({
                    'name': displayName,
                    'email': email.text.trim(),
                    'createdAt': FieldValue.serverTimestamp(),
                  });
                } else {
                  await auth.signInWithEmailAndPassword(
                    email: email.text.trim(),
                    password: password.text,
                  );
                }
              } on FirebaseAuthException catch (e) {
                message(e.message ?? 'تعذر تسجيل الدخول');
              } catch (_) {
                message('حدث خطأ. تحقق من الإنترنت وإعدادات Firebase');
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

            @override
            void dispose() {
              email.dispose();
              password.dispose();
              name.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                      begin: Alignment.topLeft,
                      end: Alignment.bottomRight,
                      colors: [bg, Color(0xFF291038), bg],
                    ),
                  ),
                  child: SafeArea(
                    child: Center(
                      child: SingleChildScrollView(
                        padding: const EdgeInsets.all(26),
                        child: Column(
                          children: [
                            Container(
                              width: 92,
                              height: 92,
                              decoration: BoxDecoration(
                                borderRadius: BorderRadius.circular(28),
                                gradient: const LinearGradient(
                                  colors: [pink, purple],
                                ),
                                boxShadow: [
                                  BoxShadow(
                                    color: pink.withValues(alpha: 0.3),
                                    blurRadius: 28,
                                  ),
                                ],
                              ),
                              child: const Icon(
                                Icons.play_arrow_rounded,
                                size: 65,
                                color: Colors.white,
                              ),
                            ),
                            const SizedBox(height: 18),
                            const BrandTitle(size: 38),
                            const SizedBox(height: 8),
                            const Text('عالمك، فيديوهاتك، لحظاتك'),
                            const SizedBox(height: 30),
                            if (registering) ...[
                              TextField(
                                controller: name,
                                decoration: const InputDecoration(
                                  labelText: 'اسم المستخدم',
                                  prefixIcon: Icon(Icons.person_outline),
                                ),
                              ),
                              const SizedBox(height: 14),
                            ],
                            TextField(
                              controller: email,
                              keyboardType: TextInputType.emailAddress,
                              decoration: const InputDecoration(
                                labelText: 'البريد الإلكتروني',
                                prefixIcon: Icon(Icons.email_outlined),
                              ),
                            ),
                            const SizedBox(height: 14),
                            TextField(
                              controller: password,
                              obscureText: true,
                              decoration: const InputDecoration(
                                labelText: 'كلمة المرور',
                                prefixIcon: Icon(Icons.lock_outline),
                              ),
                            ),
                            const SizedBox(height: 22),
                            SizedBox(
                              width: double.infinity,
                              height: 54,
                              child: FilledButton(
                                style: FilledButton.styleFrom(
                                  backgroundColor: pink,
                                ),
                                onPressed: busy ? null : submit,
                                child: busy
                                    ? const CircularProgressIndicator()
                                    : Text(
                                        registering
                                            ? 'إنشاء حساب جديد'
                                            : 'تسجيل الدخول',
                                      ),
                              ),
                            ),
                            TextButton(
                              onPressed: () => setState(
                                () => registering = !registering,
                              ),
                              child: Text(
                                registering
                                    ? 'عندي حساب بالفعل'
                                    : 'ما عندك حساب؟ أنشئ حساباً',
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class BrandTitle extends StatelessWidget {
            final double size;
            const BrandTitle({super.key, this.size = 28});

            @override
            Widget build(BuildContext context) {
              return RichText(
                text: TextSpan(
                  style: TextStyle(
                    fontSize: size,
                    fontWeight: FontWeight.w900,
                    letterSpacing: 1.5,
                  ),
                  children: const [
                    TextSpan(
                      text: 'TiK',
                      style: TextStyle(color: Colors.white),
                    ),
                    TextSpan(
                      text: 'TWO',
                      style: TextStyle(color: pink),
                    ),
                  ],
                ),
              );
            }
          }

          class MainScreen extends StatefulWidget {
            const MainScreen({super.key});

            @override
            State<MainScreen> createState() => _MainScreenState();
          }

          class _MainScreenState extends State<MainScreen> {
            int tab = 0;

            @override
            Widget build(BuildContext context) {
              final pages = [
                const VideoFeed(),
                const SearchScreen(),
                const UploadScreen(),
                const NotificationsScreen(),
                const ProfileScreen(),
              ];

              return Scaffold(
                body: IndexedStack(index: tab, children: pages),
                bottomNavigationBar: NavigationBar(
                  height: 68,
                  backgroundColor: const Color(0xFF100D16),
                  indicatorColor: pink.withValues(alpha: 0.18),
                  selectedIndex: tab,
                  onDestinationSelected: (index) =>
                      setState(() => tab = index),
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home, color: pink),
                      label: 'الرئيسية',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.search),
                      selectedIcon: Icon(Icons.search, color: pink),
                      label: 'بحث',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.add_box_outlined),
                      selectedIcon: Icon(Icons.add_box, color: pink),
                      label: 'إضافة',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.notifications_none),
                      selectedIcon: Icon(Icons.notifications, color: pink),
                      label: 'الإشعارات',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.person_outline),
                      selectedIcon: Icon(Icons.person, color: pink),
                      label: 'حسابي',
                    ),
                  ],
                ),
              );
            }
          }

          class VideoFeed extends StatefulWidget {
            const VideoFeed({super.key});

            @override
            State<VideoFeed> createState() => _VideoFeedState();
          }

          class _VideoFeedState extends State<VideoFeed> {
            final urls = const [
              'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4',
              'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
              'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4',
            ];

            final controllers = <VideoPlayerController>[];
            final liked = <int>{};
            int current = 0;
            bool loading = true;
            bool failed = false;

            @override
            void initState() {
              super.initState();
              prepare();
            }

            Future<void> prepare() async {
              try {
                for (final url in urls) {
                  controllers.add(
                    VideoPlayerController.networkUrl(Uri.parse(url)),
                  );
                }

                await Future.wait(
                  controllers.map((c) async {
                    await c.initialize();
                    await c.setLooping(true);
                  }),
                );

                if (!mounted) return;
                setState(() {
                  loading = false;
                  failed = false;
                });
                await controllers.first.play();
              } catch (_) {
                if (!mounted) return;
                setState(() {
                  loading = false;
                  failed = true;
                });
              }
            }

            Future<void> retry() async {
              for (final c in controllers) {
                await c.dispose();
              }
              controllers.clear();
              setState(() {
                loading = true;
                failed = false;
              });
              await prepare();
            }

            @override
            void dispose() {
              for (final c in controllers) {
                c.dispose();
              }
              super.dispose();
            }

            Future<void> showComments(int index) async {
              final input = TextEditingController();
              final comments = <String>[];

              await showModalBottomSheet<void>(
                context: context,
                isScrollControlled: true,
                backgroundColor: panel,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, update) => Padding(
                    padding: EdgeInsets.only(
                      left: 18,
                      right: 18,
                      top: 22,
                      bottom: MediaQuery.of(ctx).viewInsets.bottom + 18,
                    ),
                    child: SafeArea(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text(
                            'التعليقات',
                            style: TextStyle(
                              fontSize: 22,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                          const SizedBox(height: 16),
                          if (comments.isEmpty)
                            const Padding(
                              padding: EdgeInsets.symmetric(vertical: 12),
                              child: Text('كن أول من يكتب تعليقاً'),
                            ),
                          ...comments.map(
                            (comment) => ListTile(
                              leading: const CircleAvatar(
                                backgroundColor: purple,
                                child: Icon(Icons.person),
                              ),
                              title: Text(comment),
                            ),
                          ),
                          Row(
                            children: [
                              Expanded(
                                child: TextField(
                                  controller: input,
                                  decoration: const InputDecoration(
                                    hintText: 'اكتب تعليقاً...',
                                  ),
                                ),
                              ),
                              IconButton(
                                onPressed: () {
                                  if (input.text.trim().isEmpty) return;
                                  update(() {
                                    comments.add(input.text.trim());
                                    input.clear();
                                  });
                                },
                                icon: const Icon(Icons.send, color: pink),
                              ),
                            ],
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
              input.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (loading) {
                return const Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      BrandTitle(size: 32),
                      SizedBox(height: 20),
                      CircularProgressIndicator(color: pink),
                      SizedBox(height: 14),
                      Text('جارٍ تحميل الفيديوهات...'),
                    ],
                  ),
                );
              }

              if (failed || controllers.isEmpty) {
                return Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Icon(Icons.wifi_off, size: 55, color: pink),
                      const SizedBox(height: 12),
                      const Text('تعذر تحميل الفيديوهات'),
                      const SizedBox(height: 12),
                      FilledButton(
                        onPressed: retry,
                        child: const Text('إعادة المحاولة'),
                      ),
                    ],
                  ),
                );
              }

              return PageView.builder(
                scrollDirection: Axis.vertical,
                itemCount: controllers.length,
                onPageChanged: (index) {
                  controllers[current].pause();
                  current = index;
                  controllers[current].play();
                  setState(() {});
                },
                itemBuilder: (context, index) {
                  final c = controllers[index];

                  return Stack(
                    fit: StackFit.expand,
                    children: [
                      GestureDetector(
                        onTap: () {
                          setState(() {
                            if (c.value.isPlaying) {
                              c.pause();
                            } else {
                              c.play();
                            }
                          });
                        },
                        child: FittedBox(
                          fit: BoxFit.cover,
                          child: SizedBox(
                            width: c.value.size.width,
                            height: c.value.size.height,
                            child: VideoPlayer(c),
                          ),
                        ),
                      ),
                      const DecoratedBox(
                        decoration: BoxDecoration(
                          gradient: LinearGradient(
                            begin: Alignment.topCenter,
                            end: Alignment.bottomCenter,
                            colors: [
                              Color(0x55000000),
                              Colors.transparent,
                              Color(0xCC000000),
                            ],
                          ),
                        ),
                      ),
                      Positioned(
                        top: 46,
                        left: 0,
                        right: 0,
                        child: Center(child: const BrandTitle(size: 28)),
                      ),
                      Positioned(
                        right: 10,
                        bottom: 108,
                        child: Column(
                          children: [
                            const CircleAvatar(
                              radius: 24,
                              backgroundColor: purple,
                              child: Icon(Icons.person, color: Colors.white),
                            ),
                            const SizedBox(height: 12),
                            IconButton(
                              onPressed: () => setState(() {
                                if (!liked.add(index)) liked.remove(index);
                              }),
                              icon: Icon(
                                liked.contains(index)
                                    ? Icons.favorite
                                    : Icons.favorite_border,
                                color: liked.contains(index)
                                    ? pink
                                    : Colors.white,
                                size: 34,
                              ),
                            ),
                            Text(liked.contains(index) ? 'أعجبك' : 'إعجاب'),
                            const SizedBox(height: 10),
                            IconButton(
                              onPressed: () => showComments(index),
                              icon: const Icon(
                                Icons.comment_outlined,
                                size: 30,
                              ),
                            ),
                            const Text('تعليق'),
                            const SizedBox(height: 10),
                            IconButton(
                              onPressed: () async {
                                try {
                                  await SharePlus.instance.share(
                                    ShareParams(
                                      text: 'شاهد فيديو على TiKTWO\n${urls[index]}',
                                    ),
                                  );
                                } catch (_) {
                                  if (context.mounted) {
                                    ScaffoldMessenger.of(context).showSnackBar(
                                      const SnackBar(
                                        content: Text('تعذرت المشاركة'),
                                      ),
                                    );
                                  }
                                }
                              },
                              icon: const Icon(Icons.share_outlined, size: 30),
                            ),
                            const Text('مشاركة'),
                          ],
                        ),
                      ),
                      Positioned(
                        left: 16,
                        right: 82,
                        bottom: 34,
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              '@tiktwo_${index + 1}',
                              style: const TextStyle(
                                fontSize: 17,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 8),
                            const Text('اكتشف لحظات جديدة على TiKTWO ✨'),
                            const SizedBox(height: 12),
                            VideoProgressIndicator(
                              c,
                              allowScrubbing: true,
                              colors: const VideoProgressColors(
                                playedColor: pink,
                                bufferedColor: purple,
                                backgroundColor: Colors.white24,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  );
                },
              );
            }
          }

          class SearchScreen extends StatefulWidget {
            const SearchScreen({super.key});

            @override
            State<SearchScreen> createState() => _SearchScreenState();
          }

          class _SearchScreenState extends State<SearchScreen> {
            final search = TextEditingController();

            final creators = const [
              ('@tiktwo_1', 'فيديوهات متنوعة', Icons.movie_outlined),
              ('@tiktwo_2', 'لحظات جميلة', Icons.favorite_outline),
              ('@tiktwo_3', 'اكتشف الجديد', Icons.explore_outlined),
            ];

            @override
            void dispose() {
              search.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final results = creators
                  .where((item) =>
                      item.$1.toLowerCase().contains(search.text.toLowerCase()) ||
                      item.$2.contains(search.text))
                  .toList();

              return SafeArea(
                child: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    const BrandTitle(size: 30),
                    const SizedBox(height: 20),
                    const Text(
                      'اكتشف TiKTWO',
                      style: TextStyle(
                        fontSize: 25,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 16),
                    TextField(
                      controller: search,
                      onChanged: (_) => setState(() {}),
                      decoration: const InputDecoration(
                        hintText: 'ابحث عن اسم أو محتوى...',
                        prefixIcon: Icon(Icons.search, color: pink),
                      ),
                    ),
                    const SizedBox(height: 22),
                    const Text(
                      'حسابات مقترحة',
                      style: TextStyle(
                        fontSize: 18,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 10),
                    for (final item in results)
                      Card(
                        color: panel,
                        child: ListTile(
                          leading: const CircleAvatar(
                            backgroundColor: purple,
                            child: Icon(Icons.person, color: Colors.white),
                          ),
                          title: Text(item.$1),
                          subtitle: Text(item.$2),
                          trailing: const Icon(
                            Icons.play_circle_outline,
                            color: pink,
                          ),
                        ),
                      ),
                    if (results.isEmpty)
                      const Padding(
                        padding: EdgeInsets.all(20),
                        child: Text('ما لقينا نتائج مطابقة'),
                      ),
                    const SizedBox(height: 12),
                    const Text(
                      'هذه نتائج تجريبية. البحث عن جميع المستخدمين يحتاج ربط قاعدة البيانات.',
                      style: TextStyle(color: Colors.white60, fontSize: 12),
                    ),
                  ],
                ),
              );
            }
          }

          class NotificationsScreen extends StatelessWidget {
            const NotificationsScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    const BrandTitle(size: 30),
