          class UploadScreen extends StatefulWidget {
            const UploadScreen({super.key});

            @override
            State<UploadScreen> createState() => _UploadScreenState();
          }

          class _UploadScreenState extends State<UploadScreen> {
            String? selectedName;
            bool busy = false;

            Future<void> chooseVideo() async {
              setState(() => busy = true);
              try {
                final file = await ImagePicker().pickVideo(
                  source: ImageSource.gallery,
                  maxDuration: const Duration(minutes: 3),
                );

                if (file != null && mounted) {
                  setState(() => selectedName = file.name);
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text(
                        'تم اختيار الفيديو. لم يُنشر للآخرين بعد.',
                      ),
                    ),
                  );
                }
              } catch (_) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text('تعذر اختيار الفيديو من الهاتف'),
                    ),
                  );
                }
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Container(
                          width: 112,
                          height: 112,
                          decoration: BoxDecoration(
                            borderRadius: BorderRadius.circular(30),
                            gradient: const LinearGradient(
                              colors: [pink, purple],
                            ),
                          ),
                          child: const Icon(
                            Icons.video_call_outlined,
                            size: 64,
                          ),
                        ),
                        const SizedBox(height: 24),
                        const Text(
                          'أضف فيديوك',
                          style: TextStyle(
                            fontSize: 28,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 10),
                        const Text('اختر فيديو من معرض هاتفك'),
                        const SizedBox(height: 24),
                        SizedBox(
                          width: double.infinity,
                          height: 54,
                          child: FilledButton.icon(
                            style: FilledButton.styleFrom(
                              backgroundColor: pink,
                            ),
                            onPressed: busy ? null : chooseVideo,
                            icon: const Icon(Icons.add),
                            label: Text(
                              busy ? 'جارٍ الاختيار...' : 'اختيار فيديو',
                            ),
                          ),
                        ),
                        if (selectedName != null) ...[
                          const SizedBox(height: 18),
                          const Icon(
                            Icons.check_circle,
                            color: purple,
                            size: 32,
                          ),
                          const SizedBox(height: 8),
                          Text(
                            selectedName!,
                            textAlign: TextAlign.center,
                          ),
                          const SizedBox(height: 8),
                          const Text(
                            'تم اختيار الملف على جهازك فقط.',
                            textAlign: TextAlign.center,
                          ),
                        ],
                      ],
                    ),
                  ),
                ),
              );
            }
          }

