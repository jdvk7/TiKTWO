name: Build TiKTWO

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --project-name tiktwo --org com.tiktwo .

      - name: Create TiKTWO interface
        run: |
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';

          void main() => runApp(const TikTwoApp());

          const pink = Color(0xFFFF2D75);
          const purple = Color(0xFF8B5CF6);
          const bg = Color(0xFF09090F);

          class TikTwoApp extends StatelessWidget {
            const TikTwoApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'TiKTWO',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: bg,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: pink,
                    brightness: Brightness.dark,
                  ),
                  useMaterial3: true,
                ),
                home: const FeedPage(),
              );
            }
          }

          class FeedPage extends StatefulWidget {
            const FeedPage({super.key});

            @override
            State<FeedPage> createState() => _FeedPageState();
          }

          class _FeedPageState extends State<FeedPage> {
            int index = 0;
            int tab = 0;
            final Set<int> liked = {};

            final videos = [
              ['Mira', '@mira.vibes', 'يوم جديد، طاقة جديدة ✨'],
              ['Ali', '@ali.creator', 'عيش اللحظة 💜'],
              ['Noor', '@noor.daily', 'ابتسم، الحياة حلوة 🌸'],
            ];

            void notify(String text) {
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(text),
                  backgroundColor: purple,
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final current = videos[index];

              return Scaffold(
                body: SafeArea(
                  child: Stack(
                    fit: StackFit.expand,
                    children: [
                      GestureDetector(
                        onVerticalDragEnd: (_) {
                          setState(() {
                            index = (index + 1) % videos.length;
                          });
                        },
                        child: Container(
                          decoration: BoxDecoration(
                            gradient: LinearGradient(
                              begin: Alignment.topLeft,
                              end: Alignment.bottomRight,
                              colors: [
                                index.isEven
                                    ? const Color(0xFF42164B)
                                    : const Color(0xFF172D50),
                                const Color(0xFF211025),
                                bg,
                              ],
                            ),
                          ),
                          child: Center(
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                Container(
                                  width: 112,
                                  height: 112,
                                  decoration: BoxDecoration(
                                    shape: BoxShape.circle,
                                    gradient: const LinearGradient(
                                      colors: [pink, purple],
                                    ),
                                    boxShadow: [
                                      BoxShadow(
                                        color: pink.withAlpha(90),
                                        blurRadius: 35,
                                      ),
                                    ],
                                  ),
                                  child: const Icon(
                                    Icons.play_arrow_rounded,
                                    size: 78,
                                    color: Colors.white,
                                  ),
                                ),
                                const SizedBox(height: 22),
                                const Text(
                                  'TiKTWO',
                                  style: TextStyle(
                                    fontSize: 35,
                                    fontWeight: FontWeight.w900,
                                    letterSpacing: 3,
                                  ),
                                ),
                                const SizedBox(height: 10),
                                const Text(
                                  'كل لحظة إلها قصة',
                                  style: TextStyle(
                                    fontSize: 17,
                                    color: Colors.white70,
                                  ),
                                ),
                                const SizedBox(height: 22),
                                const Text(
                                  'اسحب للأعلى للتنقل',
                                  style: TextStyle(
                                    color: Colors.white54,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),

                      Positioned(
                        top: 15,
                        left: 0,
                        right: 0,
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            const Text(
                              'أتابع',
                              style: TextStyle(
                                color: Colors.white60,
                              ),
                            ),
                            const SizedBox(width: 22),
                            Container(
                              padding: const EdgeInsets.only(
                                bottom: 7,
                              ),
                              decoration: const BoxDecoration(
                                border: Border(
                                  bottom: BorderSide(
                                    color: pink,
                                    width: 3,
                                  ),
                                ),
                              ),
                              child: const Text(
                                'لك',
                                style: TextStyle(
                                  fontSize: 20,
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                            ),
                            const SizedBox(width: 22),
                            const Icon(Icons.search, size: 27),
                          ],
                        ),
                      ),

                      Positioned(
                        right: 12,
                        bottom: 105,
                        child: Column(
                          children: [
                            const CircleAvatar(
                              radius: 25,
                              backgroundColor: purple,
                              child: Icon(
                                Icons.person,
                                color: Colors.white,
                                size: 30,
                              ),
                            ),
                            const SizedBox(height: 22),
                            action(
                              liked.contains(index)
                                  ? Icons.favorite
                                  : Icons.favorite_border,
                              liked.contains(index) ? '1.1K' : '1K',
                              liked.contains(index) ? pink : Colors.white,
                              () {
                                setState(() {
                                  if (!liked.add(index)) {
                                    liked.remove(index);
                                  }
                                });
                              },
                            ),
                            const SizedBox(height: 20),
                            action(
                              Icons.mode_comment_outlined,
                              'تعليق',
                              Colors.white,
                              () => notify(
                                'التعليقات نضيفها بالمرحلة القادمة',
                              ),
                            ),
                            const SizedBox(height: 20),
                            action(
                              Icons.bookmark_border,
                              'حفظ',
                              Colors.white,
                              () => notify('ميزة الحفظ قيد التطوير'),
                            ),
                            const SizedBox(height: 20),
                            action(
                              Icons.share_outlined,
                              'مشاركة',
                              Colors.white,
                              () => notify('ميزة المشاركة قيد التطوير'),
                            ),
                          ],
                        ),
                      ),

                      Positioned(
                        left: 15,
                        right: 82,
                        bottom: 105,
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              current[0],
                              style: const TextStyle(
                                fontSize: 21,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 5),
                            Text(
                              current[1],
                              style: const TextStyle(
                                color: Colors.white70,
                              ),
                            ),
                            const SizedBox(height: 10),
                            Text(
                              current[2],
                              style: const TextStyle(fontSize: 15),
                            ),
                            const SizedBox(height: 12),
                            const Row(
                              children: [
                                Icon(Icons.music_note, size: 18),
                                SizedBox(width: 6),
                                Expanded(
                                  child: Text(
                                    'الصوت الأصلي - TiKTWO',
                                    overflow: TextOverflow.ellipsis,
                                  ),
                                ),
                              ],
                            ),
                          ],
                        ),
                      ),

                      Positioned(
                        left: 0,
                        right: 0,
                        bottom: 0,
                        child: Container(
                          decoration: const BoxDecoration(
                            color: bg,
                            border: Border(
                              top: BorderSide(
                                color: Colors.white12,
                              ),
                            ),
                          ),
                          child: Row(
                            mainAxisAlignment:
                                MainAxisAlignment.spaceAround,
                            children: [
                              nav(Icons.home_filled, 'الرئيسية', 0),
                              nav(Icons.explore_outlined, 'اكتشف', 1),
                              GestureDetector(
                                onTap: () => notify(
                                  'رفع الفيديوهات نضيفه لاحقاً',
                                ),
                                child: Container(
                                  margin: const EdgeInsets.symmetric(
                                    vertical: 10,
                                  ),
                                  width: 45,
                                  height: 34,
                                  decoration: BoxDecoration(
                                    borderRadius: BorderRadius.circular(10),
                                    gradient: const LinearGradient(
                                      colors: [pink, purple],
                                    ),
                                  ),
                                  child: const Icon(Icons.add, size: 30),
                                ),
                              ),
                              nav(Icons.inbox_outlined, 'الرسائل', 2),
                              nav(Icons.person_outline, 'حسابي', 3),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget action(
              IconData icon,
              String label,
              Color color,
              VoidCallback onTap,
            ) {
              return GestureDetector(
                onTap: onTap,
                child: Column(
                  children: [
                    Icon(icon, size: 32, color: color),
                    const SizedBox(height: 4),
                    Text(
                      label,
                      style: const TextStyle(fontSize: 11),
                    ),
                  ],
                ),
              );
            }

            Widget nav(IconData icon, String label, int value) {
              return GestureDetector(
                onTap: () {
                  setState(() => tab = value);
                  if (value != 0) {
                    notify('$label — نضيفها لاحقاً');
                  }
                },
                child: Padding(
                  padding: const EdgeInsets.symmetric(vertical: 12),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Icon(
                        icon,
                        color: tab == value ? pink : Colors.white60,
                        size: 25,
                      ),
                      const SizedBox(height: 3),
                      Text(
                        label,
                        style: TextStyle(
                          fontSize: 10,
                          color: tab == value ? pink : Colors.white60,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART

      - name: Set Android app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="TiKTWO"/' android/app/src/main/AndroidManifest.xml

      - name: Save project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Create TiKTWO Flutter app"
            git push origin HEAD:main
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TiKTWO-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
