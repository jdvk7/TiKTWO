                    const SizedBox(height: 26),
                    Card(
                      color: panel,
                      child: const Column(
                        children: [
                          ListTile(
                            leading: Icon(Icons.video_library, color: pink),
                            title: Text('فيديوهاتي'),
                            subtitle: Text('ستظهر فيديوهاتك المنشورة هنا'),
                          ),
                          Divider(height: 1),
                          ListTile(
                            leading: Icon(Icons.favorite_outline, color: purple),
                            title: Text('الفيديوهات التي أعجبتني'),
                            subtitle: Text('اكتشف محتواك المفضل'),
                          ),
                          Divider(height: 1),
                          ListTile(
