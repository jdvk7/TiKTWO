
name: Build TiKTWO APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TiKTWO Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Firebase configuration
        shell: bash
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json is missing."
            exit 1
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --project-name tiktwo --org com.tiktwo .

      - name: Configure Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1
              )
          s = re.sub(r'android:label="[^"]*"', 'android:label="TiKTWO"', s)
          p.write_text(s)

          for filename in (
              "android/app/build.gradle.kts",
              "android/app/build.gradle",
          ):
              p = Path(filename)
              if p.exists():
                  s = p.read_text()
                  s = re.sub(
                      r'minSdk\s*=\s*flutter\.minSdkVersion',
                      'minSdk = 23',
                      s
                  )
                  s = re.sub(
                      r'minSdkVersion\s+flutter\.minSdkVersion',
                      'minSdkVersion 23',
                      s
                  )
                  p.write_text(s)
          PY

      - name: Install app dependencies
        run: |
          flutter pub add firebase_core firebase_auth cloud_firestore video_player image_picker

      - name: Generate Firebase options
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("google-services.json").read_text())
          info = data["project_info"]

          client = next(
              (
                  item for item in data["client"]
                  if item["client_info"]["android_client_info"]["package_name"]
                  == "com.tiktwo.tiktwo"
              ),
              None
          )

          if client is None:
              raise SystemExit(
                  "ERROR: Firebase Android package must be com.tiktwo.tiktwo"
              )

          api_key = client["api_key"][0]["current_key"]
          app_id = client["client_info"]["mobilesdk_app_id"]
          project_id = info["project_id"]
          sender_id = str(info["project_number"])
          bucket = info.get("storage_bucket")

          lines = [
              "import 'package:firebase_core/firebase_core.dart';",
              "",
              "class DefaultFirebaseOptions {",
              "  static const FirebaseOptions android = FirebaseOptions(",
              f"    apiKey: {json.dumps(api_key)},",
              f"    appId: {json.dumps(app_id)},",
              f"    messagingSenderId: {json.dumps(sender_id)},",
              f"    projectId: {json.dumps(project_id)},",
          ]

          if bucket:
              lines.append(f"    storageBucket: {json.dumps(bucket)},")

          lines.extend(["  );", "}"])
          Path("lib/firebase_options.dart").write_text(
              "\n".join(lines) + "\n"
          )
          PY

      - name: Write complete TiKTWO app
        shell: bash
        run: |
          cat > lib/main.dart <<'DART'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:video_player/video_player.dart';
          import 'firebase_options.dart';

          const bg = Color(0xFF09070D);
          const pink = Color(0xFFFF2D8D);
          const purple = Color(0xFF9B5CFF);

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(
              options: DefaultFirebaseOptions.android,
            );
            runApp(const TikTwoApp());
          }

          class TikTwoApp extends StatelessWidget {
            const TikTwoApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'TiKTWO',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: bg,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: pink,
                    brightness: Brightness.dark,
                  ),
                ),
                home: const AuthGate(),
              );
            }
          }

          class AuthGate extends StatelessWidget {
            const AuthGate({super.key});

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<User?>(
                stream: FirebaseAuth.instance.authStateChanges(),
                builder: (context, snapshot) {
                  if (snapshot.connectionState == ConnectionState.waiting) {
                    return const Scaffold(
                      body: Center(
                        child: CircularProgressIndicator(color: pink),
                      ),
                    );
                  }
                  if (snapshot.hasError) {
                    return const Scaffold(
                      body: Center(
                        child: Text('تعذر الاتصال بخدمة الحسابات'),
                      ),
                    );
                  }
                  return snapshot.data == null
                      ? const LoginScreen()
                      : const MainScreen();
                },
              );
            }
          }

          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});

            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final email = TextEditingController();
            final password = TextEditingController();
            final name = TextEditingController();
            bool registering = false;
            bool busy = false;

            void showMessage(String text) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(text)),
              );
            }

            Future<void> submit() async {
              if (email.text.trim().isEmpty ||
                  password.text.length < 6) {
                showMessage('أدخل البريد وكلمة مرور من 6 أحرف على الأقل');
                return;
              }

              setState(() => busy = true);

              try {
                final auth = FirebaseAuth.instance;
                UserCredential result;

                if (registering) {
                  result = await auth.createUserWithEmailAndPassword(
                    email: email.text.trim(),
                    password: password.text,
                  );

                  final displayName = name.text.trim().isEmpty
                      ? email.text.trim().split('@').first
                      : name.text.trim();

                  await result.user?.updateDisplayName(displayName);

                  await FirebaseFirestore.instance
                      .collection('users')
                      .doc(result.user!.uid)
                      .set({
                    'name': displayName,
                    'email': email.text.trim(),
                    'createdAt': FieldValue.serverTimestamp(),
                  });
                } else {
                  result = await auth.signInWithEmailAndPassword(
                    email: email.text.trim(),
                    password: password.text,
                  );
                }
              } on FirebaseAuthException catch (e) {
                showMessage(e.message ?? 'تعذر إتمام تسجيل الدخول');
              } catch (e) {
                showMessage('حدث خطأ. تحقق من الإنترنت وإعدادات Firebase');
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

            @override
            void dispose() {
              email.dispose();
              password.dispose();
              name.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                      begin: Alignment.topLeft,
                      end: Alignment.bottomRight,
                      colors: [bg, Color(0xFF281035), bg],
                    ),
                  ),
                  child: SafeArea(
                    child: Center(
                      child: SingleChildScrollView(
                        padding: const EdgeInsets.all(26),
                        child: Column(
                          children: [
                            Container(
                              width: 88,
                              height: 88,
                              decoration: BoxDecoration(
                                borderRadius: BorderRadius.circular(26),
                                gradient: const LinearGradient(
                                  colors: [pink, purple],
                                ),
                              ),
                              child: const Icon(
                                Icons.play_arrow_rounded,
                                size: 60,
                                color: Colors.white,
                              ),
                            ),
                            const SizedBox(height: 16),
                            const Text(
                              'TiKTWO',
                              style: TextStyle(
                                fontSize: 38,
                                fontWeight: FontWeight.w900,
                                letterSpacing: 2,
                              ),
                            ),
                            const Text('عالمك، فيديوهاتك، لحظاتك'),
                            const SizedBox(height: 30),
                            if (registering) ...[
                              TextField(
                                controller: name,
                                decoration: const InputDecoration(
                                  labelText: 'اسم المستخدم',
                                  prefixIcon: Icon(Icons.person_outline),
                                  border: OutlineInputBorder(),
                                ),
                              ),
                              const SizedBox(height: 14),
                            ],
                            TextField(
                              controller: email,
                              keyboardType: TextInputType.emailAddress,
                              decoration: const InputDecoration(
                                labelText: 'البريد الإلكتروني',
                                prefixIcon: Icon(Icons.email_outlined),
                                border: OutlineInputBorder(),
                              ),
                            ),
                            const SizedBox(height: 14),
                            TextField(
                              controller: password,
                              obscureText: true,
                              decoration: const InputDecoration(
                                labelText: 'كلمة المرور',
                                prefixIcon: Icon(Icons.lock_outline),
                                border: OutlineInputBorder(),
                              ),
                            ),
                            const SizedBox(height: 22),
                            SizedBox(
                              width: double.infinity,
                              height: 52,
                              child: FilledButton(
                                style: FilledButton.styleFrom(
                                  backgroundColor: pink,
                                ),
                                onPressed: busy ? null : submit,
                                child: busy
                                    ? const CircularProgressIndicator()
                                    : Text(
                                        registering
                                            ? 'إنشاء حساب'
                                            : 'تسجيل الدخول',
                                        style: const TextStyle(fontSize: 17),
                                      ),
                              ),
                            ),
                            TextButton(
                              onPressed: () => setState(
                                () => registering = !registering,
                              ),
                              child: Text(
                                registering
                                    ? 'عندي حساب بالفعل'
                                    : 'إنشاء حساب جديد',
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class MainScreen extends StatefulWidget {
            const MainScreen({super.key});

            @override
            State<MainScreen> createState() => _MainScreenState();
          }

          class _MainScreenState extends State<MainScreen> {
            int tab = 0;

            @override
            Widget build(BuildContext context) {
              const pages = [
                VideoFeed(),
                UploadScreen(),
                ProfileScreen(),
              ];

              return Scaffold(
                body: IndexedStack(index: tab, children: pages),
                bottomNavigationBar: NavigationBar(
                  backgroundColor: const Color(0xFF100D16),
                  indicatorColor: pink.withValues(alpha: 0.2),
                  selectedIndex: tab,
                  onDestinationSelected: (index) =>
                      setState(() => tab = index),
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home, color: pink),
                      label: 'الرئيسية',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.add_box_outlined),
                      selectedIcon: Icon(Icons.add_box, color: pink),
                      label: 'إضافة',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.person_outline),
                      selectedIcon: Icon(Icons.person, color: pink),
                      label: 'حسابي',
                    ),
                  ],
                ),
              );
            }
          }

          class VideoFeed extends StatefulWidget {
            const VideoFeed({super.key});

            @override
            State<VideoFeed> createState() => _VideoFeedState();
          }

          class _VideoFeedState extends State<VideoFeed> {
            final urls = const [
              'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4',
              'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
              'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4',
            ];

            final controllers = <VideoPlayerController>[];
            final liked = <int>{};
            int current = 0;
            bool loading = true;
            bool failed = false;

            @override
            void initState() {
              super.initState();
              prepare();
            }

            Future<void> prepare() async {
              try {
                for (final url in urls) {
                  controllers.add(
                    VideoPlayerController.networkUrl(Uri.parse(url)),
                  );
                }

                await Future.wait(
                  controllers.map((controller) async {
                    await controller.initialize();
                    await controller.setLooping(true);
                  }),
                );

                if (!mounted) return;
                setState(() {
                  loading = false;
                  failed = false;
                });
                await controllers.first.play();
              } catch (_) {
                if (!mounted) return;
                setState(() {
                  loading = false;
                  failed = true;
                });
              }
            }

            @override
            void dispose() {
              for (final controller in controllers) {
                controller.dispose();
              }
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              if (loading) {
                return const Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(Icons.play_circle_fill, size: 70, color: pink),
                      SizedBox(height: 12),
                      Text(
                        'TiKTWO',
                        style: TextStyle(
                          fontSize: 28,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      SizedBox(height: 12),
                      CircularProgressIndicator(color: purple),
                      SizedBox(height: 12),
                      Text('جارٍ تحميل الفيديوهات...'),
                    ],
                  ),
                );
              }

              if (failed || controllers.isEmpty) {
                return Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Icon(Icons.wifi_off, size: 55, color: pink),
                      const SizedBox(height: 12),
                      const Text('تعذر تحميل الفيديوهات'),
                      const SizedBox(height: 12),
                      FilledButton(
                        onPressed: () {
                          for (final c in controllers) {
                            c.dispose();
                          }
                          controllers.clear();
                          setState(() {
                            loading = true;
                            failed = false;
                          });
                          prepare();
                        },
                        child: const Text('إعادة المحاولة'),
                      ),
                    ],
                  ),
                );
              }

              return PageView.builder(
                scrollDirection: Axis.vertical,
                itemCount: controllers.length,
                onPageChanged: (index) {
                  controllers[current].pause();
                  current = index;
                  controllers[current].play();
                  setState(() {});
                },
                itemBuilder: (context, index) {
                  final c = controllers[index];

                  return Stack(
                    fit: StackFit.expand,
                    children: [
                      GestureDetector(
                        onTap: () {
                          setState(() {
                            if (c.value.isPlaying) {
                              c.pause();
                            } else {
                              c.play();
                            }
                          });
                        },
                        child: FittedBox(
                          fit: BoxFit.cover,
                          child: SizedBox(
                            width: c.value.size.width,
                            height: c.value.size.height,
                            child: VideoPlayer(c),
                          ),
                        ),
                      ),
                      const DecoratedBox(
                        decoration: BoxDecoration(
                          gradient: LinearGradient(
                            begin: Alignment.topCenter,
                            end: Alignment.bottomCenter,
                            colors: [
                              Color(0x55000000),
                              Colors.transparent,
                              Color(0xBB000000),
                            ],
                          ),
                        ),
                      ),
                      Positioned(
                        top: 48,
                        left: 0,
                        right: 0,
                        child: Center(
                          child: RichText(
                            text: const TextSpan(
                              style: TextStyle(
                                fontSize: 27,
                                fontWeight: FontWeight.w900,
                              ),
                              children: [
                                TextSpan(
                                  text: 'TiK',
                                  style: TextStyle(color: Colors.white),
                                ),
                                TextSpan(
                                  text: 'TWO',
                                  style: TextStyle(color: pink),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                      Positioned(
                        right: 12,
                        bottom: 105,
                        child: Column(
                          children: [
                            const CircleAvatar(
                              radius: 24,
                              backgroundColor: purple,
                              child: Icon(Icons.person, color: Colors.white),
                            ),
                            const SizedBox(height: 16),
                            IconButton(
                              onPressed: () => setState(() {
                                if (!liked.add(index)) liked.remove(index);
                              }),
                              icon: Icon(
                                liked.contains(index)
                                    ? Icons.favorite
                                    : Icons.favorite_border,
                                color: liked.contains(index)
                                    ? pink
                                    : Colors.white,
                                size: 34,
                              ),
                            ),
                            Text(liked.contains(index) ? 'أعجبك' : 'إعجاب'),
                            const SizedBox(height: 14),
                            IconButton(
                              onPressed: () => showDialog<void>(
                                context: context,
                                builder: (ctx) => AlertDialog(
                                  title: const Text('التعليقات'),
                                  content: const Text(
                                    'ميزة التعليقات تحتاج إلى استكمال إعدادات التطبيق.',
                                  ),
                                  actions: [
                                    TextButton(
                                      onPressed: () => Navigator.pop(ctx),
                                      child: const Text('إغلاق'),
                                    ),
                                  ],
                                ),
                              ),
                              icon: const Icon(
                                Icons.comment_outlined,
                                size: 30,
                              ),
                            ),
                            const Text('تعليق'),
                            const SizedBox(height: 14),
                            IconButton(
                              onPressed: () => ScaffoldMessenger.of(context)
                                  .showSnackBar(
                                const SnackBar(
                                  content: Text('المشاركة ستتوفر لاحقاً'),
                                ),
                              ),
                              icon: const Icon(Icons.share_outlined, size: 30),
                            ),
                            const Text('مشاركة'),
                          ],
                        ),
                      ),
                      Positioned(
                        left: 16,
                        right: 85,
                        bottom: 34,
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              '@tiktwo_${index + 1}',
                              style: const TextStyle(
                                fontSize: 17,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 8),
                            const Text('اكتشف لحظات جديدة على TiKTWO ✨'),
                            const SizedBox(height: 12),
                            VideoProgressIndicator(
                              c,
                              allowScrubbing: true,
                              colors: const VideoProgressColors(
                                playedColor: pink,
                                bufferedColor: purple,
                                backgroundColor: Colors.white24,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  );
                },
              );
            }
          }

          class UploadScreen extends StatefulWidget {
            const UploadScreen({super.key});

            @override
            State<UploadScreen> createState() => _UploadScreenState();
          }

          class _UploadScreenState extends State<UploadScreen> {
            String? selectedName;
            bool busy = false;

            Future<void> chooseVideo() async {
              setState(() => busy = true);
              try {
                final file = await ImagePicker().pickVideo(
                  source: ImageSource.gallery,
                  maxDuration: const Duration(minutes: 3),
                );

                if (file != null && mounted) {
                  setState(() => selectedName = file.name);
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text(
                        'تم اختيار الفيديو. نشره للآخرين يحتاج إلى خدمة تخزين.',
                      ),
                    ),
                  );
                }
              } catch (_) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text('تعذر اختيار الفيديو من الهاتف'),
                    ),
                  );
                }
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return SafeArea(
                child: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Container(
                          width: 110,
                          height: 110,
                          decoration: BoxDecoration(
                            borderRadius: BorderRadius.circular(28),
                            gradient: const LinearGradient(
                              colors: [pink, purple],
                            ),
                          ),
                          child: const Icon(
                            Icons.video_call_outlined,
                            size: 62,
                          ),
                        ),
                        const SizedBox(height: 24),
                        const Text(
                          'أضف فيديوك',
                          style: TextStyle(
                            fontSize: 28,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 12),
                        const Text('اختر فيديو من معرض هاتفك'),
                        const SizedBox(height: 22),
                        SizedBox(
                          width: double.infinity,
                          height: 52,
                          child: FilledButton.icon(
                            style: FilledButton.styleFrom(
                              backgroundColor: pink,
                            ),
                            onPressed: busy ? null : chooseVideo,
                            icon: const Icon(Icons.add),
                            label: Text(
                              busy ? 'جارٍ الاختيار...' : 'اختيار فيديو',
                            ),
                          ),
                        ),
                        if (selectedName != null) ...[
                          const SizedBox(height: 18),
                          const Icon(
                            Icons.check_circle,
                            color: purple,
                            size: 32,
                          ),
                          const SizedBox(height: 8),
                          Text(
                            selectedName!,
                            textAlign: TextAlign.center,
                          ),
                          const SizedBox(height: 8),
                          const Text(
                            'الفيديو موجود على جهازك ولم يُنشر للآخرين.',
                            textAlign: TextAlign.center,
                          ),
                        ],
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class ProfileScreen extends StatelessWidget {
            const ProfileScreen({super.key});

            @override
            Widget build(BuildContext context) {
              final user = FirebaseAuth.instance.currentUser;
              final displayName = user?.displayName ??
                  user?.email?.split('@').first ??
                  'مستخدم TiKTWO';

              return SafeArea(
                child: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Container(
                          width: 100,
                          height: 100,
                          decoration: const BoxDecoration(
                            shape: BoxShape.circle,
                            gradient: LinearGradient(
                              colors: [pink, purple],
                            ),
                          ),
                          child: const Icon(
                            Icons.person,
                            size: 60,
                            color: Colors.white,
                          ),
                        ),
                        const SizedBox(height: 18),
                        Text(
                          displayName,
                          style: const TextStyle(
                            fontSize: 25,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 8),
                        Text(user?.email ?? ''),
                        const SizedBox(height: 28),
                        const Text(
                          'أهلاً بك في مجتمع TiKTWO',
                          style: TextStyle(color: purple, fontSize: 17),
                        ),
                        const SizedBox(height: 28),
                        SizedBox(
                          width: double.infinity,
                          child: OutlinedButton.icon(
                            onPressed: () =>
                                FirebaseAuth.instance.signOut(),
                            icon: const Icon(Icons.logout, color: pink),
                            label: const Text('تسجيل الخروج'),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DART

      - name: Get Flutter packages
        run: flutter pub get

      - name: Remove default Flutter test
        run: rm -f test/widget_test.dart

      - name: Analyze application
        run: flutter analyze --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
